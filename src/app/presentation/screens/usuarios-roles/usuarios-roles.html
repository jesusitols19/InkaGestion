<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold"><i class="bi bi-people-fill me-2"></i>Usuarios Registrados</h3>
    <button mat-flat-button color="primary" (click)="abrirModalNuevoUsuario()">
      <i class="bi bi-person-plus me-1"></i> Agregar Usuario
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <div class="table-responsive">
        <table mat-table [dataSource]="usuarios" class="mat-elevation-z2 w-100">

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let u">{{ u.id }}</td>
          </ng-container>

          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let u">{{ u.nombre }}</td>
          </ng-container>

          <ng-container matColumnDef="correo">
            <th mat-header-cell *matHeaderCellDef>Correo</th>
            <td mat-cell *matCellDef="let u">{{ u.correo }}</td>
          </ng-container>

          <ng-container matColumnDef="rol">
            <th mat-header-cell *matHeaderCellDef>Rol</th>
            <td mat-cell *matCellDef="let u">{{ u.role_name }}</td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let u">
              <button mat-icon-button color="accent" (click)="abrirModalEditarUsuario(u)">
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="['id','nombre','correo','rol','acciones']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['id','nombre','correo','rol','acciones'];"></tr>

        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
