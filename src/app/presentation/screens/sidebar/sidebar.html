<div class="wrapper">
  <aside id="sidebar">

    <div class="sidebar-header">
    <button class="toggle-btn" type="button" (click)="toggleSidebar()">

    <img src="assets/images/logo2.png" alt="Logo pequeño" class="toggle-img logo-small" />
    <!-- Logo versión grande -->
    <img src="assets/images/logo_small_bg2.png" alt="Logo grande" class="toggle-img logo-large" />
    </button>
    <div class="sidebar-logo">
    <a>
    <span class="empresa">INKA PERU</span>
    <br>
    <span class="subtitulo">INTRANET</span>
    </a>
    </div>
    </div>



    <ul class="sidebar-nav">
        <li class="sidebar-item">
            <a routerLink="dashboard" class="sidebar-link" routerLinkActive="active">
                <i class="fa fa-gauge"></i>
                <span>DASHBOARD</span>
            </a>
        </li>
    <li class="sidebar-item">
    <a routerLink="mis-datos" class="sidebar-link" routerLinkActive="active">
    <i class="fa fa-id-card"></i>
    <span>MIS DATOS</span>
    </a>
    </li>
    <li class="sidebar-item">
    <a routerLink="usuarios-roles" class="sidebar-link" routerLinkActive="active">
    <i class="fa fa-users"></i>
    <span>USUARIOS</span>
    </a>
    </li>
    <li class="sidebar-item">
    <a routerLink="asistencia" class="sidebar-link" routerLinkActive="active">
    <i class="fa fa-calendar-check"></i>
    <span>ASISTENCIA</span>
    </a>
    </li>
    <li class="sidebar-item">
    <a routerLink="jornada-horarios" class="sidebar-link" routerLinkActive="active">
    <i class="fa fa-clock"></i>

    </a>
    </li>
    <li class="sidebar-item">
    <a routerLink="planillas" class="sidebar-link" routerLinkActive="active">

    </a>

    <a routerLink="pagos-adelantos" class="sidebar-link" routerLinkActive="active">
    <i class="fa fa-money-bill-wave"></i>
    <span>PAGOS Y ADELANTOS</span>
    </a>

    </li>
    <li class="sidebar-item">
    <a routerLink="reportes" class="sidebar-link" routerLinkActive="active">
    <i class="fa fa-file-alt"></i>
    <span>REPORTES</span>
    </a>
    </li>
    </ul>


    <div class="sidebar-footer">
      <a (click)="logout()" class="sidebar-link logout" style="cursor: pointer;">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Logout</span>
      </a>
    </div>

  <div class="main">
