<div class="theme-toggle">
  <button (click)="toggleTheme()" [class.dark]="isDarkMode">
    <span class="material-symbols-outlined">
      {{ isDarkMode ? 'dark_mode' : 'light_mode' }}
    </span>
  </button>
</div>


<div class="login-container">
  <div class="login-card glass-effect">
    <!-- Logo -->
    <div class="logo">
      <img src="assets/images/logo_small_bg2.png" alt="Logo Inka Perú" />
    </div>

    <!-- Título -->
    <h1 class="titulo">Bienvenido a Inka Perú</h1>
    <p class="subtitulo">Inicia sesión para continuar</p>

    <!-- Formulario -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email -->
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input
          id="correo"
          type="email"
          formControlName="CORREO"
          placeholder="ejemplo@inka.pe"
          required
        />
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <p-password
          formControlName="CONTRASENIA"
          [toggleMask]="true"
          [feedback]="false"
          inputId="password"
          placeholder="Ingresa tu contraseña"
        ></p-password>
      </div>

      <!-- Recordarme -->
      <div class="extras">
        <div>
          <input type="checkbox" id="remember" />
          <label for="remember">Recordarme</label>
        </div>

      </div>

      @if (errorMessage) {
  <div class="p-3 my-2 text-sm text-red-700 bg-red-100 rounded-lg" role="alert">
    {{ errorMessage }}
  </div>
}
      <!-- Botón -->
      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>
